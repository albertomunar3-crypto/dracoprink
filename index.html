<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dracoprink | Iniciar Sesión</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="contenedor">

    <div class="login">

        <img src="logo.png" alt="Logo Dracoprink" class="logo">

        <h1>Bienvenido</h1>

        <p class="subtitulo">
            Sistema de Gestión Dracoprink
        </p>

        <form>

            <label>Usuario</label>

            <input
                type="text"
                id="usuario"
                placeholder="Ingrese su usuario">

            <label>Contraseña</label>

            <input
                type="password"
                id="password"
                placeholder="Ingrese su contraseña">

            <button
                type="button"
                onclick="iniciarSesion()">

                Ingresar

            </button>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
